<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Rome Ides geography  schematic</title>
  <desc id="desc">Schematic, not to scale. Domus Publica, Forum, Capitol, Curia Pompeia.</desc>
  <rect width="900" height="560" fill="#f4efe6"/>
  <text x="20" y="28" font-family="Georgia, serif" font-size="18" fill="#222">Rome  Ides week schematic (NOT TO SCALE) · B-model</text>
  <text x="20" y="48" font-family="Georgia, serif" font-size="11" fill="#555">Walking times are order-of-magnitude. North approx. top.</text>

  <!-- Campus Martius / west -->
  <rect x="40" y="80" width="320" height="220" fill="#e0e8ef" stroke="#6a8499" stroke-width="2"/>
  <text x="50" y="100" font-family="Georgia, serif" font-size="13" fill="#234">Campus Martius (south edge)</text>

  <rect x="70" y="130" width="160" height="70" fill="#c9d6e3" stroke="#334" stroke-width="2"/>
  <text x="85" y="160" font-family="Georgia, serif" font-size="12" font-weight="bold">Theatre of Pompey</text>
  <text x="85" y="178" font-family="Georgia, serif" font-size="10">portico / gardens</text>

  <rect x="250" y="140" width="90" height="55" fill="#8b1e1e" stroke="#300" stroke-width="2"/>
  <text x="258" y="165" font-family="Georgia, serif" font-size="11" fill="#fff" font-weight="bold">CURIA</text>
  <text x="255" y="180" font-family="Georgia, serif" font-size="10" fill="#fff">POMPEIA</text>
  <text x="255" y="192" font-family="Georgia, serif" font-size="9" fill="#fcc">IDES SITE</text>

  <text x="70" y="230" font-family="Georgia, serif" font-size="10" fill="#333">Antony delayed in portico (Trebonius)</text>
  <text x="70" y="248" font-family="Georgia, serif" font-size="10" fill="#333">Lepidus troops orbit nearby (Campus)</text>

  <!-- Capitoline -->
  <ellipse cx="520" cy="200" rx="70" ry="55" fill="#d8cfc0" stroke="#5a4a3a" stroke-width="2"/>
  <text x="485" y="195" font-family="Georgia, serif" font-size="12" font-weight="bold">CAPITOL</text>
  <text x="478" y="212" font-family="Georgia, serif" font-size="10">Jupiter / Liberators</text>
  <text x="490" y="226" font-family="Georgia, serif" font-size="10">after murder</text>

  <!-- Forum -->
  <rect x="420" y="280" width="280" height="120" fill="#efe6d6" stroke="#8a734d" stroke-width="2"/>
  <text x="430" y="300" font-family="Georgia, serif" font-size="13" font-weight="bold">Forum Romanum</text>
  <text x="430" y="318" font-family="Georgia, serif" font-size="10">Rostra · funeral pyre · riot</text>
  <rect x="450" y="330" width="100" height="45" fill="#f0d9a0" stroke="#664"/>
  <text x="460" y="350" font-family="Georgia, serif" font-size="10">Sacra Via ’</text>
  <text x="460" y="365" font-family="Georgia, serif" font-size="10">shops / tabernae</text>

  <!-- Domus Publica -->
  <rect x="560" y="335" width="110" height="50" fill="#2f5d3a" stroke="#0f2" stroke-width="2"/>
  <text x="568" y="355" font-family="Georgia, serif" font-size="11" fill="#fff" font-weight="bold">DOMUS</text>
  <text x="568" y="370" font-family="Georgia, serif" font-size="11" fill="#fff" font-weight="bold">PUBLICA</text>
  <text x="575" y="400" font-family="Georgia, serif" font-size="10" fill="#2f5d3a">HOUSE-1 (Caesar)</text>

  <!-- Paths -->
  <path d="M615 335 Q580 260 520 230" fill="none" stroke="#8b1e1e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="540" y="270" font-family="Georgia, serif" font-size="10" fill="#8b1e1e">flight ~2035 min</text>

  <path d="M560 360 Q400 300 340 195" fill="none" stroke="#2f5d3a" stroke-width="2.5"/>
  <text x="380" y="250" font-family="Georgia, serif" font-size="10" fill="#2f5d3a">litter 2035 min ’ Curia</text>

  <path d="M520 250 Q500 280 500 300" fill="none" stroke="#5a4a3a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="430" y="275" font-family="Georgia, serif" font-size="10">Capitol ” Forum ~820 min</text>

  <!-- Legend -->
  <rect x="40" y="340" width="340" height="180" fill="#fff" stroke="#999"/>
  <text x="55" y="365" font-family="Georgia, serif" font-size="13" font-weight="bold">Legend / times (B)</text>
  <text x="55" y="390" font-family="Georgia, serif" font-size="11">" Domus Publica ’ Curia Pompeia: 2035 min litter</text>
  <text x="55" y="410" font-family="Georgia, serif" font-size="11">" Curia ’ Capitol (flight): 2035 min</text>
  <text x="55" y="430" font-family="Georgia, serif" font-size="11">" Capitol ” Forum: 820 min</text>
  <text x="55" y="450" font-family="Georgia, serif" font-size="11">" Octavian: NOT in this map on 15 Mar (Apollonia)</text>
  <text x="55" y="475" font-family="Georgia, serif" font-size="11">" Subura (rumour dens): east/northeast of Forum  off map</text>
  <text x="55" y="500" font-family="Georgia, serif" font-size="11">Source working file: research/rome_topography.md</text>
</svg>
